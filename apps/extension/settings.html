<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ClipCon Ingest — Configurações</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="settings">
    <h1>ClipCon Ingest</h1>
    <p class="muted">Conecte a extensão ao seu ClipCon. Sua senha não é armazenada — apenas a sessão.</p>

    <hr class="sep" />

    <section id="sec-api">
      <label for="api-url">URL da API ClipCon</label>
      <input id="api-url" type="url" placeholder="https://sua-api.up.railway.app" />
      <p class="muted tiny" style="margin-top:6px">
        A extensão descobre automaticamente o Supabase e as chaves públicas via
        <code>/config.js</code> desta API.
      </p>
      <div style="margin-top:10px; display:flex; gap:8px">
        <button id="btn-connect" class="primary" type="button">Conectar</button>
        <span id="api-status" class="muted small"></span>
      </div>
    </section>

    <hr class="sep" />

    <section id="sec-login">
      <h2 style="font-size:15px; margin-bottom:8px">Conta</h2>
      <div id="login-form">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" />
        <label for="password" style="margin-top:10px">Senha</label>
        <input id="password" type="password" autocomplete="current-password" />
        <div style="margin-top:12px; display:flex; gap:8px; align-items:center">
          <button id="btn-login" class="primary" type="button">Entrar</button>
          <span id="login-status" class="muted small"></span>
        </div>
      </div>
      <div id="logged-in" hidden>
        <p>Conectado como <strong id="whoami"></strong></p>
        <div style="margin-top:12px">
          <button id="btn-logout" class="ghost" type="button">Desconectar</button>
        </div>
      </div>
    </section>
  </body>
  <script src="settings.js"></script>
</html>
